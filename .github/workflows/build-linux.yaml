name: "linux tests and package builds for 'template_test'"
# This workflow is triggered on pushes to the repository.
on: [push]

jobs:

  commitlint:
    name: lint commit message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  test-linux:
    name: pytest on linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv-env
        with:
          python-version: ${{ matrix.python_version }}
      - name: test with pytest
        run: uv run pytest --cov-report=xml --cov=template_test tests

  type-check-linux:
    name: type check on linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv-env
        with:
          python-version: ${{ matrix.python_version }}
      - name: run type-checker
        run: make typecheck

  linting-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
          args: "--version"
      - name: Run ruff check
        run: ruff check src/
      - name: Run ruff check
        run: ruff format --check --diff src/

  build_python_package:
    name: build python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv-env
      - name: create packages
        run: uv run python -m build
      - name: upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-dists
          path: dist/

  release_python_package:
    name: publish python package to pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs:
      - test-linux
      - type-check-linux
      - linting-linux
      - build_python_package
      - build_conda_package
    permissions:
      id-token: write
    steps:
      - name: Retrieve build distributions
        uses: actions/download-artifact@v7
        with:
          name: build-dists
          path: dist/
      - name: publish to PyPI  # make sure you have pypi trusted publishing configured for this repo: https://docs.pypi.org/trusted-publishers/
        uses: pypa/gh-action-pypi-publish@release/v1


  build_conda_package:
    name: conda package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: build conda package
        run: uvx --from kiara --with kiara_plugin.dev kiara build conda pkg --channel dharpa --channel conda-forge --patch-data ci/conda/conda-pkg-patch.yaml --output-folder build-dir .
      - name: upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: conda-pkgs
          path: build-dir/

  release_conda_package:
    name: publish conda package to anaconda
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs:
      - test-linux
      - type-check-linux
      - linting-linux
      - build_python_package
      - build_conda_package
    steps:
      - name: check if ANACONDA_PUSH_TOKEN is set
        run: |
          if [ -z "${{ secrets.ANACONDA_PUSH_TOKEN }}" ]; then
          echo "Error: ANACONDA_PUSH_TOKEN secret is not set"
          echo "Please configure the ANACONDA_PUSH_TOKEN secret in your repository settings"
          exit 1
          else
          echo "ANACONDA_PUSH_TOKEN is configured"
          fi
      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Retrieve build distributions
        uses: actions/download-artifact@v7
        with:
          name: conda-pkgs
          path: build-dir/
      - name: release conda package
        run: uvx --from kiara --with kiara_plugin.dev kiara build conda publish --user freckles --channel main --token "${{ secrets.ANACONDA_PUSH_TOKEN }}" build-dir


  merge_tag_to_main:
    name: merge current tag to main branch
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      contents: write
      actions: write
    needs:
      - release_python_package
      - release_conda_package
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - run: git config --global user.email "markus@frkl.dev"
    - run: git config --global user.name "Markus Binsteiner"
    - name: extract tag name
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    - name: checkout main branch
      run: |
        if git show-ref --verify --quiet refs/heads/main; then
          git checkout main
        else
          git checkout -b main
        fi
    - name: merge tag
      run: git merge "${RELEASE_VERSION}"
    - name: push updated main branch
      run: git push https://${{ secrets.GITHUB_TOKEN }}@github.com/makkus/template_test.git
